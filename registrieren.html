{% load static %}

<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="{% static 'styles/style.css' %}">
    <title>SmartZeit - Registrierung </title>
</head>

<body>
<div class="login-container">
    <div class="logo-container">
        <div class="logo">
            <img src="{% static 'images/logo.png' %}" alt="SmartZeit Logo" class="logo-image">
        </div>
        <p class="untertitel">Kostenloses Konto erstellen</p>
    </div>


    {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="form-reihe">
            <div class="form-gruppe">
                <label for="firstname">Vorname</label>
                <input type="text" id="firstname" name="firstname" required>
            </div>

            <div class="form-gruppe">
                <label for="lastname">Nachname</label>
                <input type="text" id="lastname" name="lastname" required>
            </div>
        </div>

        <div class="form-gruppe">
            <label for="email">E-Mail-Adresse</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-gruppe">
            <label for="password">Passwort</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="form-gruppe">
            <label for="password-confirm">Passwort bestätigen</label>
            <input type="password" id="password-confirm" name="password-confirm" required>
        </div>

        <button type="submit" class="anmelden">Konto erstellen</button>

    </form>

    <div class="login-link">
        Bereits registriert? <a href="{% url 'login' %}">Jetzt anmelden</a>
    </div>
</div>
</body>
</html>
